<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX SERVER V.7 - CLOUD BANDAR</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --mahjong-green: #004d40; --gold: #ffcc00; --neon-red: #ff0033; }
        @keyframes bgMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { 
            background: linear-gradient(-45deg, #050505, #002b24, #1a0a0a, #050505);
            background-size: 400% 400%; animation: bgMove 10s ease infinite;
            color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; overflow-x: hidden;
        }
        #lightning-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10000; display: none; }
        .app-container { width: 100%; max-width: 380px; background: rgba(0,0,0,0.92); border-radius: 35px; padding: 20px; border: 2px solid var(--mahjong-green); box-shadow: 0 0 30px rgba(0,255,100,0.2); display: none; margin: 20px auto; position: relative; backdrop-filter: blur(10px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .bal-display { background: #000; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-size: 18px; }
        .slot-area { background: var(--mahjong-green); padding: 15px; border-radius: 20px; border: 4px solid #b28900; box-shadow: inset 0 0 20px #000; margin-bottom: 15px; }
        .reels { display: flex; gap: 8px; justify-content: center; }
        .reel { width: 90px; height: 125px; background: linear-gradient(180deg, #fff, #ddd); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 60px; color: #000; border-bottom: 6px solid #999; }
        .spinning { animation: blurSpin 0.1s infinite linear; }
        @keyframes blurSpin { 0% { transform: translateY(-8px); filter: blur(4px); } 100% { transform: translateY(8px); filter: blur(8px); } }
        .bet-panel { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-adj { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); background: transparent; color: var(--gold); font-size: 20px; cursor: pointer; }
        .btn-spin { width: 100%; padding: 20px; border-radius: 50px; border: none; background: linear-gradient(180deg, #ffd700, #b28900); color: #000; font-weight: 900; font-size: 24px; cursor: pointer; box-shadow: 0 8px 0 #6d5400; margin-bottom: 10px; }
        .btn-action { font-size: 14px; padding: 12px; border-radius: 50px; border: none; font-weight: 900; cursor: pointer; }
        #win-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; border-radius: 35px; }
        #admin-panel { display: none; width: 95%; max-width: 550px; background: #0a0000; border: 2px solid var(--neon-red); border-radius: 15px; padding: 20px; margin: 20px auto; }
        .user-card { background: #1a0000; padding: 10px; border: 1px solid #400; border-radius: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .adm-row { display: flex; justify-content: space-between; align-items: center; }
        .adm-btn { padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 10px; color: white; margin: 2px; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="lightning-canvas"></canvas>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
        <h1 style="color:var(--gold); letter-spacing:10px;">VORTEX</h1>
        <input type="text" id="id-input" style="padding:18px; border-radius:15px; border:none; text-align:center; width:260px;" placeholder="ID PLAYER...">
        <button onclick="auth()" class="btn-spin" style="width:230px; margin-top:20px; font-size:16px;">CONNECT</button>
    </div>

    <!-- UI USER -->
    <div id="user-ui" class="app-container">
        <div id="win-overlay">
            <h2 style="color:var(--gold);">JACKPOT</h2>
            <div id="running-win" style="font-size:50px; color:#fff;">0</div>
        </div>
        <div class="header">
            <span id="display-name" style="font-size:11px;">READY</span>
            <div class="bal-display">Rp <span id="display-bal">0</span></div>
        </div>
        <div class="slot-area">
            <div class="reels">
                <div id="r1" class="reel">🀄</div><div id="r2" class="reel">🀄</div><div id="r3" class="reel">🀄</div>
            </div>
        </div>
        <div class="bet-panel">
            <button class="btn-adj" onclick="adjBet(-200)">-</button>
            <div style="font-size:20px;">Rp <span id="display-bet">1,000</span></div>
            <button class="btn-adj" onclick="adjBet(200)">+</button>
        </div>
        <button class="btn-spin" onclick="spin()">SPIN</button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-action" onclick="topup()" style="background: #25d366; color: white;">TOPUP</button>
            <button class="btn-action" onclick="withdraw()" style="background: #fff;">WITHDRAW</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel">
        <h2 style="color:var(--neon-red); text-align:center;">VORTEX CLOUD ADMIN</h2>
        <div id="user-list"></div>
        <button onclick="location.reload()" style="width:100%; padding:10px; background:#333; color:#fff; border:none; border-radius:10px;">LOGOUT</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqIqdlzzXoZoT8N_J9HRmpoJvbH05Da4c",
            databaseURL: "https://inject-60ad5-default-rtdb.firebaseio.com",
            projectId: "inject-60ad5",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = "";
        let currentBet = 1000;
        const ownerKey = "YANZ_OWNER";
        const waNomor = "6285764410376";

        const audio = {
            bgm: new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3'),
            spin: new Audio('https://assets.mixkit.co/active_storage/sfx/2014/2014-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3')
        };

        function auth() {
            let val = document.getElementById('id-input').value.trim().toLowerCase();
            if(!val) return;
            audio.bgm.play().catch(()=>{});
            if(val === ownerKey.toLowerCase()) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                listenAdmin();
            } else {
                myId = val;
                db.ref('users/' + myId).once('value', (s) => {
                    if(!s.exists()) { db.ref('users/' + myId).set({ balance: 0, mode: 'normal', count: 0 }); }
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('user-ui').style.display = 'block';
                    document.getElementById('display-name').innerText = "ID: " + myId.toUpperCase();
                    listenUser();
                });
            }
        }

        function listenUser() {
            db.ref('users/' + myId).on('value', (s) => {
                let data = s.val();
                if(data) document.getElementById('display-bal').innerText = data.balance.toLocaleString();
            });
        }

        function adjBet(v) { currentBet += v; if(currentBet < 200) currentBet = 200; document.getElementById('display-bet').innerText = currentBet.toLocaleString(); }

        function spin() {
            db.ref('users/' + myId).once('value', (s) => {
                let data = s.val();
                if(data.balance < currentBet) return alert("Saldo Tidak Cukup!");
                
                audio.spin.play();
                db.ref('users/' + myId + '/balance').transaction(c => c - currentBet);

                const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
                reels.forEach(r => r.classList.add('spinning'));

                setTimeout(() => {
                    reels.forEach(r => r.classList.remove('spinning'));
                    let sym = ['🀄','🐲','🧧','💰','🏮'];
                    let res = [Math.floor(Math.random()*5), Math.floor(Math.random()*5), Math.floor(Math.random()*5)];
                    
                    if(data.count > 0) {
                        if(data.mode === 'win') res = [0,0,0];
                        else while(res[0]==res[1] && res[1]==res[2]) res[2] = Math.floor(Math.random()*5);
                        db.ref('users/' + myId + '/count').transaction(c => c - 1);
                    } else {
                        if(Math.random() * 100 > 5) while(res[0]==res[1] && res[1]==res[2]) res[2] = Math.floor(Math.random()*5);
                        else res = [1,1,1];
                    }

                    reels[0].innerText = sym[res[0]]; reels[1].innerText = sym[res[1]]; reels[2].innerText = sym[res[2]];
                    if(res[0] === res[1] && res[1] === res[2]) triggerJP(currentBet * 15);
                }, 1200);
            });
        }

        function triggerJP(amt) {
            audio.win.play(); startLightning();
            const overlay = document.getElementById('win-overlay');
            overlay.style.display = 'flex';
            let start = 0;
            let timer = setInterval(() => {
                start += Math.ceil(amt/40);
                if(start >= amt) {
                    start = amt; clearInterval(timer);
                    setTimeout(() => { overlay.style.display = 'none'; document.getElementById('lightning-canvas').style.display = 'none'; }, 3000);
                }
                document.getElementById('running-win').innerText = "Rp " + start.toLocaleString();
            }, 40);
            db.ref('users/' + myId + '/balance').transaction(c => c + amt);
        }

        function startLightning() {
            const canvas = document.getElementById('lightning-canvas'); canvas.style.display = 'block';
            const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let c = 0;
            let itv = setInterval(() => {
                ctx.clearRect(0,0, canvas.width, canvas.height); ctx.strokeStyle = "white"; ctx.lineWidth = 4; ctx.shadowBlur = 40; ctx.shadowColor = "cyan"; ctx.beginPath();
                let x = Math.random()*canvas.width; ctx.moveTo(x, 0);
                for(let i=1; i<=10; i++) { x+=(Math.random()-0.5)*100; ctx.lineTo(x, (canvas.height/10)*i); }
                ctx.stroke(); c++; if(c>10) clearInterval(itv);
            }, 70);
        }

        function topup() {
            let n = prompt("Minimal Topup: Rp 10.000\nMasukkan Nominal:");
            if (n === null) return;
            let amount = parseInt(n);
            if (!isNaN(amount) && amount >= 10000) {
                db.ref('requests').push({ id: myId.toUpperCase(), type: 'TOPUP', amount: amount, time: new Date().toLocaleTimeString() });
                window.open(`https://wa.me/${waNomor}?text=KONFIRMASI TOPUP%0AID: ${myId.toUpperCase()}%0ANominal: Rp ${amount.toLocaleString()}`);
            } else { alert("Minimal Topup itu Rp 10.000!"); }
        }

        function withdraw() {
            db.ref('users/' + myId).once('value', (s) => {
                let currentBalance = s.val().balance;
                let n = prompt(`Saldo: Rp ${currentBalance.toLocaleString()}\nMinimal WD: Rp 25.000\nMasukkan Nominal:`);
                if (n === null) return;
                let amount = parseInt(n);
                if (!isNaN(amount) && amount >= 25000 && amount <= currentBalance) {
                    db.ref('requests').push({ id: myId.toUpperCase(), type: 'WITHDRAW', amount: amount, time: new Date().toLocaleTimeString() });
                    window.open(`https://wa.me/${waNomor}?text=KONFIRMASI WD%0AID: ${myId.toUpperCase()}%0ANominal: Rp ${amount.toLocaleString()}`);
                } else { alert("Saldo tidak cukup atau Minimal WD 25K!"); }
            });
        }

        function listenAdmin() {
            db.ref('users').on('value', (s) => {
                let users = s.val(); let h = "";
                for(let u in users) {
                    h += `<div class="user-card">
                        <div class="adm-row">
                            <span><b>ID: ${u}</b><br><small>Saldo: Rp ${users[u].balance.toLocaleString()}</small><br><small>Sisa Set: ${users[u].count} (${users[u].mode})</small></span>
                            <input type="number" id="cnt-${u}" value="1" style="width:40px; background:#000; color:#fff; border:1px solid #666; text-align:center;">
                        </div>
                        <div class="adm-row">
                            <button class="adm-btn" style="background:lime;color:black" onclick="setMaster('${u}','win')">SET JP</button>
                            <button class="adm-btn" style="background:red" onclick="setMaster('${u}','lose')">SET LOSE</button>
                            <button class="adm-btn" style="background:blue" onclick="manualEdit('${u}', 'plus')">+ SALDO</button>
                            <button class="adm-btn" style="background:orange" onclick="manualEdit('${u}', 'minus')">POTONG</button>
                        </div>
                    </div>`;
                }
                document.getElementById('user-list').innerHTML = h;
            });
        }

        // --- FUNGSI MASTER (JP/LOSE) ---
        // 1. FUNGSI ADMIN: BUAT NGUNCI SETINGAN
        function setMaster(u, m) {
            let c = document.getElementById('cnt-' + u).value; // Ambil angka dari input (misal: 5 atau 10)
            let totalSpin = parseInt(c);
            
            if(totalSpin > 0) {
                db.ref('users/' + u).update({ 
                    mode: m, 
                    count: totalSpin // Jatah spin masuk ke database
                }).then(() => {
                    alert("ID " + u + " BERHASIL DI-SET " + m.toUpperCase() + " SEBANYAK " + totalSpin + " KALI!");
                });
            } else {
                alert("Isi jumlah spin-nya dulu, Bos!");
            }
        }

        // 2. FUNGSI USER: SETIAP SPIN BAKAL NGURANGIN JATAH
        function spin() {
            db.ref('users/' + myId).once('value', (s) => {
                let data = s.val();
                if(data.balance < currentBet) return alert("Saldo Gak Cukup!");

                // Potong saldo & putar reel
                db.ref('users/' + myId + '/balance').transaction(c => c - currentBet);
                const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
                reels.forEach(r => r.classList.add('spinning'));

                setTimeout(() => {
                    reels.forEach(r => r.classList.remove('spinning'));
                    let sym = ['🀄','🐲','🧧','💰','🏮'];
                    let res = [Math.floor(Math.random()*5), Math.floor(Math.random()*5), Math.floor(Math.random()*5)];
                    
                    // --- LOGIKA OTOMATIS ANTRIAN ---
                    if(data.count > 0) {
                        if(data.mode === 'win') {
                            res = [0,0,0]; // Paksa JP
                        } else {
                            // Paksa Lose (cari biar gak kembar)
                            while(res[0]==res[1] && res[1]==res[2]) res[2] = Math.floor(Math.random()*5);
                        }
                        // OTOMATIS KURANGIN JATAH DI DATABASE
                        db.ref('users/' + myId + '/count').transaction(c => c - 1);
                    } else {
                        // Jika jatah (count) sudah 0, balik ke mode normal (hoki-hokian 5%)
                        if(Math.random() * 100 > 5) while(res[0]==res[1] && res[1]==res[2]) res[2] = Math.floor(Math.random()*5);
                        else res = [1,1,1];
                    }

                    reels[0].innerText = sym[res[0]]; 
                    reels[1].innerText = sym[res[1]]; 
                    reels[2].innerText = sym[res[2]];

                    if(res[0] === res[1] && res[1] === res[2]) triggerJP(currentBet * 15);
                }, 1200);
            });
        }

        function manualEdit(u, type) {
            let msg = (type === 'plus') ? "Mau kasih saldo berapa buat " : "Mau potong saldo berapa dari ";
            let amt = prompt(msg + u + "?");
            if (amt && !isNaN(amt)) {
                let nominal = parseInt(amt);
                if (type === 'minus') nominal = -nominal;
                db.ref('users/' + u + '/balance').transaction((curr) => {
                    let newBal = (curr || 0) + nominal;
                    return (newBal < 0) ? 0 : newBal;
                });
            }
        }
    </script>
</body>
</html>
