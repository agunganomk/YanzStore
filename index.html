<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX SERVER V.6 - PRO BANDAR</title>
    <style>
        :root {
            --mahjong-green: #004d40;
            --gold: #ffcc00;
            --neon-red: #ff0033;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            background: linear-gradient(-45deg, #050505, #002b24, #1a0a0a, #050505);
            background-size: 400% 400%;
            animation: bgMove 10s ease infinite;
            color: white; font-family: 'Arial Black', sans-serif; 
            margin: 0; padding: 10px; overflow-x: hidden;
        }

        #lightning-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10000; display: none;
        }

        .app-container { 
            width: 100%; max-width: 380px; background: rgba(0,0,0,0.92); 
            border-radius: 35px; padding: 20px; border: 2px solid var(--mahjong-green);
            box-shadow: 0 0 30px rgba(0,255,100,0.2); display: none; margin: 20px auto;
            position: relative; backdrop-filter: blur(10px);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .bal-display { background: #000; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-size: 18px; cursor: pointer; }

        .slot-area {
            background: var(--mahjong-green); padding: 15px; border-radius: 20px;
            border: 4px solid #b28900; box-shadow: inset 0 0 20px #000; margin-bottom: 15px;
        }
        .reels { display: flex; gap: 8px; justify-content: center; }
        .reel {
            width: 90px; height: 125px; background: linear-gradient(180deg, #fff, #ddd);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 60px; color: #000; border-bottom: 6px solid #999;
        }
        .spinning { animation: blurSpin 0.1s infinite linear; }

        @keyframes blurSpin {
            0% { transform: translateY(-8px); filter: blur(4px); }
            100% { transform: translateY(8px); filter: blur(8px); }
        }

        .bet-panel {
            background: rgba(255,255,255,0.05); padding: 12px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        .btn-adj { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); background: transparent; color: var(--gold); font-size: 20px; cursor: pointer; }

        .btn-spin {
            width: 100%; padding: 20px; border-radius: 50px; border: none;
            background: linear-gradient(180deg, #ffd700, #b28900);
            color: #000; font-weight: 900; font-size: 24px; cursor: pointer;
            box-shadow: 0 8px 0 #6d5400; margin-bottom: 10px;
        }
        .btn-spin:active { transform: translateY(4px); box-shadow: 0 4px 0 #6d5400; }

        .btn-action { font-size: 14px; padding: 12px; border-radius: 50px; border: none; font-weight: 900; cursor: pointer; }

        #win-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center; border-radius: 35px;
        }

        /* --- DASHBOARD ADMIN --- */
        #admin-panel {
            display: none; width: 95%; max-width: 550px; background: #0a0000; 
            border: 2px solid var(--neon-red); border-radius: 15px; padding: 20px;
            margin: 20px auto; box-shadow: 0 0 40px rgba(255,0,0,0.5);
        }
        .user-card {
            background: #1a0000; padding: 10px; border: 1px solid #400; 
            border-radius: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;
        }
        .adm-row { display: flex; justify-content: space-between; align-items: center; }
        .adm-btn { padding: 8px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 10px; color: white; }
        .adm-input { width: 40px; padding: 5px; border-radius: 4px; border: 1px solid #666; background: #000; color: #fff; text-align: center; }
    </style>
</head>
<body>

    <canvas id="lightning-canvas"></canvas>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
        <h1 style="color:var(--gold); letter-spacing:10px; margin:0;">VORTEX</h1>
        <p style="color:var(--mahjong-green); font-size:12px; margin-bottom:30px;">SECURE SERVER LOGIN</p>
        <input type="text" id="id-input" style="padding:18px; border-radius:15px; border:none; text-align:center; width:260px; font-size:16px;" placeholder="ID PLAYER...">
        <button onclick="auth()" class="btn-spin" style="width:230px; margin-top:20px; font-size:16px;">CONNECT</button>
    </div>

    <!-- UI USER -->
    <div id="user-ui" class="app-container">
        <div id="win-overlay">
            <h2 style="color:var(--gold); margin:0; letter-spacing:5px;">JACKPOT</h2>
            <div id="running-win" style="font-size:50px; text-shadow: 0 0 20px gold; color:#fff;">0</div>
        </div>

        <div class="header">
            <span id="display-name" style="color:#555; font-size:11px;">READY</span>
            <div class="bal-display" onclick="devAccess()">Rp <span id="display-bal">0</span></div>
        </div>

        <div class="slot-area">
            <div class="reels">
                <div id="r1" class="reel">🀄</div>
                <div id="r2" class="reel">🀄</div>
                <div id="r3" class="reel">🀄</div>
            </div>
        </div>

        <div class="bet-panel">
            <button class="btn-adj" onclick="adjBet(-200)">-</button>
            <div style="font-size:20px; color:#fff;">Rp <span id="display-bet">1,000</span></div>
            <button class="btn-adj" onclick="adjBet(200)">+</button>
        </div>

        <button class="btn-spin" onclick="spin()">SPIN</button>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-action" onclick="topup()" style="background: #25d366; color: white; box-shadow: 0 4px 0 #128c7e;">TOPUP</button>
            <button class="btn-action" onclick="withdraw()" style="background: #fff; color: #000; box-shadow: 0 4px 0 #ccc;">WITHDRAW</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel">
        <h2 style="color:var(--neon-red); text-align:center; letter-spacing:3px;">CENTRAL SERVER</h2>
        <div id="user-list"></div>
        <button onclick="location.reload()" style="width:100%; padding:12px; background:#300; color:white; border:none; border-radius:10px; margin-top:10px;">LOGOUT ADMIN</button>
    </div>

    <script>
        let myId = "";
        let currentBet = 1000;
        const ownerKey = "YANZ_OWNER"; 
        const waNomor = "6285764410376"; // GANTI NOMOR WA DISINI
        let devClicks = 0;

        const audio = {
            bgm: new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3'),
            spin: new Audio('https://assets.mixkit.co/active_storage/sfx/2014/2014-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3')
        };
        audio.bgm.loop = true; audio.bgm.volume = 0.3;

        function playSound(n) { audio[n].currentTime = 0; audio[n].play().catch(()=>{}); }

        function auth() {
            let val = document.getElementById('id-input').value.trim();
            if(!val) return;
            playSound('click'); audio.bgm.play();
            if(val === ownerKey) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                renderAdmin();
            } else {
                myId = val;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('user-ui').style.display = 'block';
                document.getElementById('display-name').innerText = "ID: " + myId.toUpperCase();
                registerUser(val); updateUI();
            }
        }

        function registerUser(n) {
            let db = JSON.parse(localStorage.getItem('v_db') || "[]");
            if(!db.includes(n)) {
                db.push(n);
                localStorage.setItem('v_db', JSON.stringify(db));
                localStorage.setItem('v_bal_'+n, 0);
                localStorage.setItem('v_mod_'+n, 'normal');
                localStorage.setItem('v_count_'+n, 0);
            }
        }

        function adjBet(v) { playSound('click'); currentBet += v; if(currentBet < 200) currentBet = 200; document.getElementById('display-bet').innerText = currentBet.toLocaleString(); }

        function spin() {
            let bal = parseInt(localStorage.getItem('v_bal_'+myId) || 0);
            if(bal < currentBet) return alert("SALDO TIDAK CUKUP!");

            bal -= currentBet;
            localStorage.setItem('v_bal_'+myId, bal);
            updateUI(); playSound('spin');

            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
            reels.forEach(r => r.classList.add('spinning'));

            setTimeout(() => {
                reels.forEach(r => r.classList.remove('spinning'));
                let sym = ['🀄','🐲','🧧','💰','🏮'];
                let res = [Math.floor(Math.random()*5), Math.floor(Math.random()*5), Math.floor(Math.random()*5)];
                
                let mode = localStorage.getItem('v_mod_'+myId);
                let count = parseInt(localStorage.getItem('v_count_'+myId) || 0);

                if(count > 0) {
                    if(mode === 'win') { res = [0,0,0]; }
                    else if(mode === 'lose') { while(res[0]==res[1] && res[1]==res[2]) { res[2] = Math.floor(Math.random()*5); } }
                    
                    count--;
                    localStorage.setItem('v_count_'+myId, count);
                    if(count === 0) localStorage.setItem('v_mod_'+myId, 'normal');
                } else {
                    // Mode Otomatis jika count 0
                    let autoChance = Math.random() * 100;
                    if(autoChance < 5) { res = [1,1,1]; } // Peluang murni 5%
                    else { while(res[0]==res[1] && res[1]==res[2]) { res[2] = Math.floor(Math.random()*5); } }
                }

                reels[0].innerText = sym[res[0]]; reels[1].innerText = sym[res[1]]; reels[2].innerText = sym[res[2]];
                if(res[0] === res[1] && res[1] === res[2]) { triggerJP(currentBet * 1); }
            }, 1200);
        }

        function triggerJP(amt) {
            playSound('win'); startLightning();
            const overlay = document.getElementById('win-overlay');
            overlay.style.display = 'flex';
            let start = 0;
            let timer = setInterval(() => {
                start += Math.ceil(amt/40);
                if(start >= amt) { start = amt; clearInterval(timer); setTimeout(() => { overlay.style.display = 'none'; document.getElementById('lightning-canvas').style.display = 'none'; }, 3000); }
                document.getElementById('running-win').innerText = "Rp " + start.toLocaleString();
            }, 40);
            localStorage.setItem('v_bal_'+myId, parseInt(localStorage.getItem('v_bal_'+myId)) + amt);
            updateUI();
        }

        function startLightning() {
            const canvas = document.getElementById('lightning-canvas'); canvas.style.display = 'block';
            const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let c = 0;
            let itv = setInterval(() => {
                ctx.clearRect(0,0, canvas.width, canvas.height); ctx.strokeStyle = "white"; ctx.lineWidth = 4; ctx.shadowBlur = 40; ctx.shadowColor = "cyan"; ctx.beginPath();
                let x = Math.random()*canvas.width; ctx.moveTo(x, 0);
                for(let i=1; i<=10; i++) { x+=(Math.random()-0.5)*100; ctx.lineTo(x, (canvas.height/10)*i); }
                ctx.stroke(); c++; if(c>10) clearInterval(itv);
            }, 70);
        }

        function topup() {
            let n = prompt("Minimal Topup: Rp 10.000\nNominal:");
            if(n && parseInt(n) >= 10000) { window.open(`https://wa.me/${waNomor}?text=Halo Bos Yanz, Mau TOPUP.%0AUser: ${myId.toUpperCase()}%0ANominal: Rp ${parseInt(n).toLocaleString()}`); }
            else if(n) alert("Minimal Topup 10K!");
        }

        function withdraw() {
            let b = parseInt(localStorage.getItem('v_bal_'+myId));
            let n = prompt(`Minimal WD: Rp 25.000\nSaldo: Rp ${b.toLocaleString()}\nNominal:`);
            if(n && parseInt(n) >= 25000 && parseInt(n) <= b) { window.open(`https://wa.me/${waNomor}?text=Halo Bos Yanz, Mau WD.%0AUser: ${myId.toUpperCase()}%0ANominal: Rp ${parseInt(n).toLocaleString()}`); }
            else if(n) alert("Saldo kurang atau minimal WD 25K!");
        }

        function renderAdmin() {
            let db = JSON.parse(localStorage.getItem('v_db') || "[]");
            let h = "";
            db.forEach(u => {
                let b = parseInt(localStorage.getItem('v_bal_'+u) || 0);
                let m = localStorage.getItem('v_mod_'+u);
                let c = localStorage.getItem('v_count_'+u) || 0;
                h += `<div class="user-card">
                    <div class="adm-row">
                        <span><b>${u}</b> (Sisa Set: ${c})<br><small style="color:var(--gold)">Rp ${b.toLocaleString()}</small></span>
                        <input type="number" id="cnt-${u}" class="adm-input" value="1">
                    </div>
                    <div class="adm-row">
                        <button class="adm-btn" onclick="setMaster('${u}','win')" style="background:lime; color:black">SET JP</button>
                        <button class="adm-btn" onclick="setMaster('${u}','lose')" style="background:red">SET LOSE</button>
                        <button class="adm-btn" onclick="addBal('${u}')" style="background:blue">+ SALDO</button>
                        <button class="adm-btn" onclick="minBal('${u}')" style="background:orange">POTONG</button>
                    </div>
                </div>`;
            });
            document.getElementById('user-list').innerHTML = h || "<p style='text-align:center'>No Users</p>";
        }

        function setMaster(u, m) {
            let val = document.getElementById('cnt-'+u).value;
            localStorage.setItem('v_mod_'+u, m);
            localStorage.setItem('v_count_'+u, parseInt(val));
            alert(u + " di-set " + m + " selama " + val + " spin!");
            renderAdmin();
        }

        function addBal(u) { let a = prompt("Tambah Saldo:"); if(a) { localStorage.setItem('v_bal_'+u, parseInt(localStorage.getItem('v_bal_'+u)||0)+parseInt(a)); renderAdmin(); } }
        function minBal(u) { let a = prompt("Potong Saldo:"); if(a) { let cur = parseInt(localStorage.getItem('v_bal_'+u)||0); localStorage.setItem('v_bal_'+u, Math.max(0, cur - parseInt(a))); renderAdmin(); } }
        function updateUI() { document.getElementById('display-bal').innerText = parseInt(localStorage.getItem('v_bal_'+myId)||0).toLocaleString(); }
        function devAccess() { devClicks++; if(devClicks>=5) { auth(); devClicks=0; } }
    </script>
</body>
</html>
